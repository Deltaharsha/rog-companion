# ROG Companion replaces asus-shutdown.service with asus-gpu-late-apply.service.
# asus-shutdown applies queued GPU mode changes while the desktop still uses the
# NVIDIA GPU, which can hang the restart after switching to Eco. The replacement
# applies them after the desktop has stopped and the NVIDIA driver is unloaded.
# https://github.com/Deltaharsha/rog-companion/tree/main/contrib/eco-restart-fix
[Unit]
Wants=asus-gpu-late-apply.service
ConditionPathExists=!/run/rog-companion-gpu/active
